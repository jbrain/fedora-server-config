# Virtual Host for Ampache Music Server (musicbox.jackson-brain.com)
# Mirrors the pattern used by music.jackson-brain.com (AirSonic)
#
# Required modules: mod_proxy mod_proxy_http mod_rewrite mod_ssl mod_headers

<VirtualHost *:80>
    ServerAdmin jack@jackson-brain.com
    ServerName musicbox.jackson-brain.com
    RewriteEngine on
    RewriteCond %{SERVER_NAME} =musicbox.jackson-brain.com
    RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]
</VirtualHost>

<VirtualHost *:443>
    ServerAdmin jack@jackson-brain.com
    ServerName musicbox.jackson-brain.com
    ErrorLog  "/var/log/httpd/ampache_proxy-error_log"
    CustomLog "/var/log/httpd/ampache_proxy-access_log" common

    SSLEngine on
    SSLProtocol all -SSLv3
    SSLProxyProtocol all -SSLv3
    SSLHonorCipherOrder on
    SSLCipherSuite PROFILE=SYSTEM
    SSLProxyCipherSuite PROFILE=SYSTEM

    <Location />
        Order allow,deny
        Allow from all
        Header set Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self'; frame-src 'self'; object-src 'none'"
    </Location>

    <IfModule mod_proxy.c>
        SSLProxyEngine On
        ProxyRequests Off
        ProxyPreserveHost On
        ProxyPass        / http://127.0.0.1:8081/
        ProxyPassReverse / http://127.0.0.1:8081/
        Header always set Strict-Transport-Security "max-age=604800"
        RequestHeader set X-Forwarded-Proto "https"
        RequestHeader set X-Forwarded-Host  "musicbox.jackson-brain.com"
    </IfModule>

    Include /etc/letsencrypt/options-ssl-apache.conf
    SSLCertificateFile    /etc/letsencrypt/live/musicbox.jackson-brain.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/musicbox.jackson-brain.com/privkey.pem
</VirtualHost>
