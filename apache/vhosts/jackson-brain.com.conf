# Virtual Hosts
#
# Required modules: mod_log_config

<VirtualHost *:80>
    ServerName jackson-brain.com
    RewriteEngine on
    RewriteCond %{SERVER_NAME} =jackson-brain.com
    RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]
</VirtualHost>

<VirtualHost *:443>
    ServerAdmin jack@jackson-brain.com
    ServerName jackson-brain.com

    ErrorLog  /var/log/httpd/jackson-brain.error.log
    CustomLog /var/log/httpd/jackson-brain.access.log combined
    LogLevel warn

    SetEnv APPLICATION_ENV "production"

    # WordPress container (see ../../wordpress/), 2026-08 migration from the native RPM
    # install at /usr/share/wordpress. Core files live in the container image; only
    # wp-content is a bind-mounted volume on the host (/storage/wordpress/wp-content).
    <IfModule mod_proxy.c>
        ProxyRequests Off
        ProxyPreserveHost On
        ProxyPass        / http://127.0.0.1:8082/
        ProxyPassReverse / http://127.0.0.1:8082/
        Header always set Strict-Transport-Security "max-age=604800"
        RequestHeader set X-Forwarded-Proto "https"
        RequestHeader set X-Forwarded-Host  "jackson-brain.com"
    </IfModule>

    # Deny PHP execution in uploads (carried over from the native install's wordpress.conf)
    <LocationMatch "^/wp-content/uploads/.*\.(php|phar)$">
        Require all denied
    </LocationMatch>

    SSLCertificateFile    /etc/letsencrypt/live/jackson-brain.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/jackson-brain.com/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf
</VirtualHost>

