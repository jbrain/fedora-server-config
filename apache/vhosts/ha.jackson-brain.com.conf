# Home Assistant reverse proxy
# Internal backend: https://homeassistant.local (self-signed cert, verification disabled)

<VirtualHost *:80>
    ServerAdmin jack@jackson-brain.com
    ServerName ha.jackson-brain.com
    RewriteEngine on
    RewriteCond %{SERVER_NAME} =ha.jackson-brain.com
    RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]
</VirtualHost>

<VirtualHost *:443>
    ServerAdmin jack@jackson-brain.com
    ServerName ha.jackson-brain.com
    ErrorLog  "/var/log/httpd/ha.jackson-brain_proxy-error_log"
    CustomLog "/var/log/httpd/ha.jackson-brain_proxy-access_log" common

    SSLEngine on
    SSLProtocol all -SSLv3
    SSLProxyProtocol all -SSLv3
    SSLHonorCipherOrder on
    SSLCipherSuite PROFILE=SYSTEM
    SSLProxyCipherSuite PROFILE=SYSTEM

    <Location />
        Order allow,deny
        Allow from all
    </Location>

    <IfModule mod_proxy.c>
        SSLProxyEngine On
        # Home Assistant uses a self-signed cert — disable peer verification
        SSLProxyVerify none
        SSLProxyCheckPeerCN off
        SSLProxyCheckPeerName off
        SSLProxyCheckPeerExpire off
        ProxyRequests Off
        # WebSocket endpoints (required for HA UI and long-lived connections)
        ProxyPass        /api/websocket        wss://homeassistant.local:443/api/websocket
        ProxyPassReverse /api/websocket        wss://homeassistant.local:443/api/websocket
        ProxyPass        /api/hassio_ingress   wss://homeassistant.local:443/api/hassio_ingress
        ProxyPassReverse /api/hassio_ingress   wss://homeassistant.local:443/api/hassio_ingress
        ProxyPass        / https://homeassistant.local/
        ProxyPassReverse / https://homeassistant.local/
    </IfModule>

    Include /etc/letsencrypt/options-ssl-apache.conf
    SSLCertificateFile    /etc/letsencrypt/live/ha.jackson-brain.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/ha.jackson-brain.com/privkey.pem
</VirtualHost>
