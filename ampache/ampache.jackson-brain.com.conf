# Virtual Host for Ampache Music Server (musicbox.jackson-brain.com)
#
# Required modules: mod_proxy mod_proxy_http mod_rewrite mod_ssl mod_headers
#                   mod_deflate

<VirtualHost *:80>
    ServerAdmin jack@jackson-brain.com
    ServerName musicbox.jackson-brain.com
    RewriteEngine on
    RewriteCond %{SERVER_NAME} =musicbox.jackson-brain.com
    RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]
</VirtualHost>

<VirtualHost *:443>
    ServerAdmin jack@jackson-brain.com
    ServerName musicbox.jackson-brain.com
    ErrorLog  "/var/log/httpd/ampache_proxy-error_log"
    # Inline format string — the 'common' alias does not resolve reliably in vhost includes
    CustomLog "/var/log/httpd/ampache_proxy-access_log" "%h %l %u %t \"%r\" %>s %b \"%{User-Agent}i\""

    # HTTP/2 for TLS connections; backend uses HTTP/1.1 (mod_proxy_http)
    # Protocols h2 http/1.1  (disabled: mod_http2 graceful-restart segfault — see 10-h2.conf)

    SSLEngine on
    # TLS protocol and cipher settings are managed by Let's Encrypt's options-ssl-apache.conf
    # (included below), which enforces TLSv1.2+ and strong ciphers.

    # Required for Ampache: allow encoded slashes in URLs without Apache decoding them
    # first. Subsonic/REST API paths can contain %2F and other encoded characters.
    # Must be at VirtualHost level — has no effect inside <Location>.
    AllowEncodedSlashes NoDecode

    # Compress API/UI text responses; skip already-compressed audio formats
    <IfModule mod_deflate.c>
        AddOutputFilterByType DEFLATE text/html text/plain text/xml text/css
        AddOutputFilterByType DEFLATE application/json application/xml application/javascript
        # Never try to compress audio streams — they are already compressed
        SetEnvIfNoCase Request_URI \.(mp3|flac|ogg|oga|m4a|opus|wav|aac|wma|ape|mpc|shn|wv)$ no-gzip
    </IfModule>

    <Location />
        Require all granted
        Header set Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self'; frame-src 'self'; object-src 'none'"
        Header always set X-Content-Type-Options "nosniff"
        Header always set X-Frame-Options "SAMEORIGIN"
    </Location>

    <IfModule mod_proxy.c>
        ProxyRequests Off
        ProxyPreserveHost On
        # nocanon: forward URL to backend exactly as received, without Apache
        # re-encoding or normalising the path. Required for Subsonic .view endpoints
        # and REST API paths that contain encoded characters.
        ProxyPass        / http://127.0.0.1:8081/ nocanon
        ProxyPassReverse / http://127.0.0.1:8081/
        # Keep connection open for long audio streams (default 300s is too short)
        ProxyTimeout 3600
        Header always set Strict-Transport-Security "max-age=31536000"
        RequestHeader set X-Forwarded-Proto "https"
        RequestHeader set X-Forwarded-Host  "musicbox.jackson-brain.com"
    </IfModule>

    Include /etc/letsencrypt/options-ssl-apache.conf
    SSLCertificateFile    /etc/letsencrypt/live/musicbox.jackson-brain.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/musicbox.jackson-brain.com/privkey.pem
</VirtualHost>
