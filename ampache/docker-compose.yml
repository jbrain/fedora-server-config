services:
  ampache:
    # nosql = no bundled MySQL; requires external DB via DB_HOST
    # Pin to major version to avoid unexpected breaking upgrades; update intentionally
    image: ampache/ampache:nosql7
    container_name: ampache
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:80"
    volumes:
      - /media/Music:/media:ro,z
      - /opt/ampache/config:/var/www/config:z
      - /opt/ampache/log:/var/log/ampache:z
      # Custom theme + branding assets — the image's own /var/www/public/themes isn't a
      # declared volume, so anything not bind-mounted here is wiped on every recreate.
      - ./themes/jackbrain:/var/www/public/themes/jackbrain:ro,z
      - ./assets:/var/www/public/images/custom:ro,z
    # Ampache's stream handler makes a server-side call back to its own public hostname
    # (local_web_path). Without this override, that call has to round-trip out through the
    # WAN/ISP router and back in (NAT hairpin), which hangs indefinitely under Podman's
    # networking. Pinning it to the LAN IP keeps the call local and instant.
    # music.jackson-brain.com (not musicbox — retired 2026-08-03, Task 04) is now the
    # canonical hostname; see plans/containerization-2026-08/README.md §8a.
    extra_hosts:
      - "music.jackson-brain.com:192.168.88.251"
    environment:
      # DB_HOST = the shared MariaDB container (see ../database/), reached over the
      # external `db-backend` Podman network. DB_USER/DB_PASSWORD = credentials used
      # during install to CREATE schema; must match AMPACHE_DB_PASSWORD in
      # ../database/.env.
      - DB_HOST=shared-mariadb
      - DB_NAME=ampache
      - DB_USER=ampache
      - DB_PASSWORD=${MYSQL_PASS}
      # AMPACHE_DB_USER/PASSWORD = credentials written to ampache.cfg.php for runtime
      - AMPACHE_DB_USER=ampache
      - AMPACHE_DB_PASSWORD=${MYSQL_PASS}
      - AMPACHE_ADMIN_USER=admin
      - AMPACHE_ADMIN_EMAIL=admin@jackson-brain.com
      - AMPACHE_ADMIN_PASSWORD=${AMPACHE_ADMIN_PASSWORD}
      - DISABLE_INOTIFYWAIT_CLEAN=1
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - db-backend

networks:
  # Owned/defined by ../database/docker-compose.yml — joined here as external so this
  # stack can reach the shared-mariadb container by name.
  db-backend:
    external: true

