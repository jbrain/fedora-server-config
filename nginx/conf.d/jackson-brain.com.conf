server {
    listen 80;
    listen [::]:80;
    server_name jackson-brain.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name jackson-brain.com;

    access_log /var/log/nginx/jackson-brain.access.log;
    error_log  /var/log/nginx/jackson-brain.error.log;

    ssl_certificate     /etc/letsencrypt/live/jackson-brain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jackson-brain.com/privkey.pem;
    include /etc/nginx/snippets/tls-intermediate.conf;
    include /etc/nginx/snippets/security-headers.conf;

    add_header Strict-Transport-Security "max-age=604800" always;

    # Match uploads.ini in ../wordpress/ (upload_max_filesize / post_max_size = 64M).
    client_max_body_size 64M;

    # Theme webroots must never expose source-control metadata, rollback copies, or editor
    # artifacts. These files were found publicly readable in the legacy jackbrain theme during
    # the 2026-08-16 security review; cleanup is performed separately on the live volume.
    location ~* ^/wp-content/themes/[^/]+/(?:\.git(?:/|$)|.*\.bak-[^/]*$|.*\.sw[op]$) {
        deny all;
    }

    # Deny PHP execution in uploads (carried over from the native install's wordpress.conf
    # and the Apache vhost's LocationMatch). Broadened 2026-08-08 (see repo memory
    # "account-creation compromise") after a compromised admin account uploaded webshells
    # disguised with double extensions (.php_.jpg etc.) via the Media Library - case-
    # insensitive and covers every PHP-executable extension variant, not just .php/.phar.
    # Defense in depth alongside the Apache-level `php_admin_flag engine off` for this same
    # directory (wordpress/apache-uploads-no-php.conf) and the now-read-only wp-content
    # mount (wordpress/docker-compose.yml) - three independent layers for the same directory.
    location ~* ^/wp-content/uploads/.*\.ph(p[0-9]?|tml|t|ar)$ {
        deny all;
    }

    # Serve the site's real favicon directly — bypasses the ephemeral WordPress container
    # entirely (its core filesystem is wiped/recreated on every restart, so anything not
    # bind-mounted there wouldn't persist). Recovered from the pre-container native install.
    location = /favicon.ico {
        alias /etc/nginx/static/jackson-brain-favicon.ico;
        access_log off;
    }

    # xmlrpc.php is not used (no Jetpack/mobile app) and is a well-known brute-force/probing
    # target — blocked outright rather than relying on rate-limiting alone, since a slow,
    # steady-drip attack (~1 request/10s) sails through burst-based limiting undetected
    # (confirmed live 2026-08-08: a probing burst at this exact pace preceded a rogue
    # admin-account creation; see repo memory "account-creation compromise RECURRED").
    location = /xmlrpc.php {
        deny all;
    }

    # Rate-limit login — a common brute-force target. burst=5 allows a short burst (e.g. a
    # real user mistyping a password a couple times) before nginx starts responding 503,
    # which is what feeds the fail2ban `nginx-limit-req` jail.
    location = /wp-login.php {
        limit_req zone=wp_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:8082;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;
    }

    location / {
        proxy_pass http://127.0.0.1:8082;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;
    }
}
