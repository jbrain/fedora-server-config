server {
    listen 80;
    listen [::]:80;
    server_name music.jackson-brain.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name music.jackson-brain.com;

    access_log /var/log/nginx/music.access.log;
    error_log  /var/log/nginx/music.error.log;

    # This domain already has its own dedicated Let's Encrypt cert (verified 2026-08-03 —
    # NOT a reused/shared fullchain as earlier notes assumed).
    ssl_certificate     /etc/letsencrypt/live/music.jackson-brain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/music.jackson-brain.com/privkey.pem;
    include /etc/nginx/snippets/tls-intermediate.conf;

    # Carried over from the (more current/complete) musicbox.jackson-brain.com Apache vhost,
    # since Ampache is moving to this hostname and retiring musicbox entirely — see repo
    # memory and plans/containerization-2026-08/README.md §8a.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self'; frame-src 'self'; object-src 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Serve the site's real favicon directly — Ampache's own custom_favicon preference
    # requires the image to be reachable through the app anyway, but this is simpler and
    # guaranteed to work regardless of that preference. Recovered from the pre-container
    # native install.
    location = /favicon.ico {
        alias /etc/nginx/static/music-favicon.ico;
        access_log off;
    }

    location / {
        # Bare proxy_pass (no URI component after the address) forwards the original
        # request URI byte-for-byte, including encoded characters like %2F — this is
        # nginx's equivalent of Apache's `AllowEncodedSlashes NoDecode` + `ProxyPass ... nocanon`,
        # both required for Subsonic/REST API paths that contain encoded slashes.
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  music.jackson-brain.com;
        # Long-lived connections for audio streaming (Apache's old ProxyTimeout 3600).
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        # Subsonic `Authorization` header passthrough is nginx's default behavior for
        # proxy_pass (no special directive needed, unlike Apache's SetEnvIf trick).
    }
}
