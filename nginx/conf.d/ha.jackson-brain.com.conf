server {
    listen 80;
    listen [::]:80;
    server_name ha.jackson-brain.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ha.jackson-brain.com;

    access_log /var/log/nginx/ha.access.log;
    error_log  /var/log/nginx/ha.error.log;

    ssl_certificate     /etc/letsencrypt/live/ha.jackson-brain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ha.jackson-brain.com/privkey.pem;
    include /etc/nginx/snippets/tls-intermediate.conf;
    include /etc/nginx/snippets/security-headers.conf;

    add_header Strict-Transport-Security "max-age=604800" always;

    # Home Assistant's backend cert (https://homeassistant.local) is self-signed —
    # verification must stay off for this backend only, never globally.
    proxy_ssl_verify off;
    # Without this, nginx doesn't send SNI matching the upstream name in the TLS ClientHello,
    # and HA's aiohttp-based server rejects the handshake ("tlsv1 unrecognized name") —
    # confirmed live 2026-08-03 during the Nginx cutover (502 on every request).
    proxy_ssl_server_name on;

    location / {
        proxy_pass https://homeassistant.local;
        # Send the BACKEND's own hostname, not the client's — matches Apache's default
        # (non-ProxyPreserveHost) behavior. Sending "ha.jackson-brain.com" here caused HA to
        # silently close the connection before any response (confirmed live 2026-08-03).
        proxy_set_header Host              $proxy_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # WebSocket upgrade support (required for /api/websocket, /api/hassio_ingress, and
        # the HA frontend generally). $connection_upgrade is defined once in nginx.conf and
        # correctly falls back to a normal keep-alive/close for non-upgrade requests too, so
        # one location block can serve the whole site.
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
    }
}
