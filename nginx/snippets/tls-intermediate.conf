# Mozilla "intermediate" TLS profile (https://ssl-config.mozilla.org/), adapted for nginx.
# TLS 1.2 + 1.3 only, modern cipher suite. Shared across all HTTPS vhosts via `include`.
#
# Note on ssl_prefer_server_ciphers: Mozilla's own intermediate config recommends `off`
# uniformly (not split per-protocol-version) — TLS 1.3's own cipher negotiation ignores this
# directive entirely, and for TLS 1.2 the curated cipher list below is safe regardless of who
# picks first. There is no nginx directive to set this differently per TLS version.
ssl_session_timeout 1d;
ssl_session_cache shared:MozSSL:10m;
ssl_session_tickets off;

ssl_protocols TLSv1.2 TLSv1.3;
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA256;
ssl_prefer_server_ciphers off;

# OCSP stapling
ssl_stapling on;
ssl_stapling_verify on;
resolver 1.1.1.1 8.8.8.8 valid=300s;
resolver_timeout 5s;
