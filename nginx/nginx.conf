# For more information on configuration, see:
#   * Official English Documentation: http://nginx.org/en/docs/

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log notice;
pid /run/nginx.pid;

# Load dynamic modules. See /usr/share/doc/nginx/README.dynamic.
include /usr/share/nginx/modules/*.conf;

events {
    worker_connections 1024;
}

http {
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile            on;
    tcp_nopush          on;
    keepalive_timeout   65;
    types_hash_max_size 4096;
    # Security hardening: don't advertise the nginx version in Server/error responses.
    server_tokens       off;

    include             /etc/nginx/mime.types;
    default_type        application/octet-stream;

    # Websocket upgrade helper — used by the ha.jackson-brain.com vhost. A single
    # `location /` can then handle both plain HTTP and WebSocket upgrade requests.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Basic rate limiting for WordPress login/xmlrpc (common brute-force targets) — also
    # gives the fail2ban `nginx-limit-req` jail something real to match (it's a no-op
    # without an actual limit_req in effect somewhere).
    limit_req_zone $binary_remote_addr zone=wp_login:10m rate=10r/m;

    # Hardened catch-all: any request whose Host header doesn't match one of the real
    # vhosts below gets dropped (444) instead of served a generic nginx welcome page or
    # matched against an arbitrary vhost's cert — avoids fingerprinting/scanning noise.
    server {
        listen       80 default_server;
        listen       [::]:80 default_server;
        server_name  _;
        return 444;
    }
    server {
        listen       443 ssl default_server;
        listen       [::]:443 ssl default_server;
        http2        on;
        server_name  _;
        ssl_reject_handshake on;
    }

    # Load modular configuration files (one per vhost) from /etc/nginx/conf.d/.
    include /etc/nginx/conf.d/*.conf;
}
