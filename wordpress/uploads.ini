; Mounted into the container at /usr/local/etc/php/conf.d/uploads.ini
; Deliberately raised above the RPM install's tiny 2M upload_max_filesize (a restriction that
; was never a deliberate choice, just the Fedora php.ini stock default) — everything else below
; matches or exceeds what was already configured natively.
upload_max_filesize = 64M
post_max_size = 64M
memory_limit = 256M
