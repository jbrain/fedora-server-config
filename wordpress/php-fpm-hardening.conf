; PHP-FPM pool hardening for the WordPress container (2026-08-16 security audit).
; Bind-mounted into /usr/local/etc/php-fpm.d/ - sorts after the base image's own
; docker.conf/zz-docker.conf (both loaded via php-fpm.conf's `include=*.conf`), so
; these directives override them.
;
; listen: the base image's docker.conf sets "listen = 9000" (all interfaces), meant
; for the separate-container nginx+php-fpm compose pattern. In THIS image nginx and
; php-fpm run in the same container and only ever talk over loopback (see
; nginx-fpm.conf's fastcgi_pass and docker-entrypoint-nginx-fpm.sh's readiness
; check). Verified live: the default "listen = 9000" left port 9000 reachable from
; ANY other container on the db-backend network (confirmed via a throwaway
; container on that network successfully connecting to wordpress:9000) - a raw
; FastCGI request there has zero access control of its own and completely bypasses
; every nginx-layer protection (uploads PHP-execution denial, xmlrpc.php block,
; hidden-file block). Restricting to loopback closes this off entirely.
listen = 127.0.0.1:9000

; Recycle workers periodically rather than never (upstream default is 0 = never) -
; bounds the impact of any slow memory leak in a long-running worker process.
pm.max_requests = 500
