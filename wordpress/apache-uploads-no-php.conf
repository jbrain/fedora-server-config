# Disables PHP execution inside wp-content/uploads unconditionally - not just for `.php`/
# `.phar`, but for EVERY possible extension trick (`.phtml`, `.pht`, `.php3`-`.php8`, etc.),
# and regardless of any future AddHandler/mime misconfiguration, since `php_admin_flag` can
# never be overridden by a lower-priority context (vhost/.htaccess) - unlike the WordPress-
# writable filesystem, this file lives outside wp-content entirely, so no WordPress-level
# compromise (a rogue admin account, a vulnerable plugin, etc.) can ever remove or weaken it.
# Directly motivated by a live incident (2026-08-08, see repo memory "account-creation
# compromise") where a compromised admin account uploaded PHP webshells disguised with
# double extensions (`.php_.jpg` etc.) via the ordinary Media Library - this closes that
# entire class of attack regardless of how admin-level access is obtained in the future.
<Directory "/var/www/html/wp-content/uploads">
	<IfModule php_module>
		php_admin_flag engine off
	</IfModule>
	<FilesMatch "\.ph(p[0-9]?|tml|t|ar)$">
		Require all denied
	</FilesMatch>
</Directory>
