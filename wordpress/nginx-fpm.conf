worker_processes auto;
pid /run/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    client_max_body_size 64m;
    # Don't leak the exact nginx version if this container is ever hit directly
    # (2026-08-16 security audit found "Server: nginx/1.26.3" on direct access,
    # even though the host reverse-proxy's own nginx already hides its version).
    server_tokens off;
    client_body_temp_path /tmp/nginx/client_body;
    fastcgi_temp_path /tmp/nginx/fastcgi;
    proxy_temp_path /tmp/nginx/proxy;
    uwsgi_temp_path /tmp/nginx/uwsgi;
    scgi_temp_path /tmp/nginx/scgi;

    server {
        listen 80;
        server_name _;
        root /var/www/html;
        index index.php;

        location = /xmlrpc.php {
            return 403;
        }

        location ~* ^/wp-content/uploads/.*\.ph(p[0-9]?|tml|t|ar)$ {
            return 403;
        }

        location ~* ^/wp-content/themes/[^/]+/(?:\.git(?:/|$)|.*\.bak-[^/]*$|.*\.sw[op]$) {
            return 403;
        }

        location ~ /\. {
            return 403;
        }

        location / {
            try_files $uri $uri/ /index.php?$args;
        }

        location ~ \.php$ {
            try_files $uri =404;
            include /etc/nginx/fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto;
            fastcgi_param HTTP_X_FORWARDED_HOST $http_x_forwarded_host;
            fastcgi_pass 127.0.0.1:9000;
        }
    }
}
