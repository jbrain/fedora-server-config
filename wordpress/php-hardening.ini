; General PHP hardening for the WordPress container (2026-08-16 security audit).
; Bind-mounted into /usr/local/etc/php/conf.d/ alongside uploads.ini.

; expose_php: don't leak the exact PHP point version (previously "X-Powered-By:
; PHP/8.4.24" was visible on every response, including the public HTTPS site) -
; that's a free, precise target list for anyone tracking PHP 8.4.x CVEs.
expose_php = Off

; disable_functions: WordPress core and this site's plugins (Contact Form 7,
; Flamingo, Google Sitemap Generator, wp-fail2ban, Jackson Brain Ampache
; Integration) never call direct shell/process-execution functions - disabling
; them closes a common RCE-via-webshell escalation path if the uploads
; PHP-execution denial and DISALLOW_FILE_MODS layers were ever bypassed. Does NOT
; include curl_exec/curl_multi_exec - WordPress's own HTTP API (wp_remote_*,
; used by cron, plugin update checks, and the Ampache integration) depends on
; those.
disable_functions = exec,system,shell_exec,passthru,proc_open,popen,show_source
